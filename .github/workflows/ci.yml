name: Scan for leaks, build and scan image, and push.

on:
  workflow_dispatch:
  push:
    branches: [main, release]

env:
  REGISTRY: docker.io
  IMAGE_NAME: dummyapi
  DOCKERFILE_PATH: ./Dockerfile
  IMAGE_TAG: ${{ github.sha }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: "@swiss-superman,@KaoKsn"

  semgrep-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SAST using semgrep
        run: semgrep --config auto --severity WARNING --exclude '*/.github/workflows/*.yml' .

  build-publish:
    needs: [gitleaks, semgrep-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup docker buildx.
        uses: docker/setup-buildx-action@v3

      - name: Build the container image locally
        uses: docker/build-push-action@v6
        env:
          IMAGE_REPO: docker.io/${{ secrets.DOCKER_USERNAME }}/dummyapi
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}:latest

      - name: Checking if the image is present locally.
        env:
          IMAGE_REPO: docker.io/${{ secrets.DOCKER_USERNAME }}/dummyapi
        run:
          docker image inspect "${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"

      - name: Trivy image scan for critical vulnerabilites in os, libarires.
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          IMAGE_REPO: docker.io/${{ secrets.DOCKER_USERNAME }}/dummyapi
        with: 
          image-ref: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          format: "json"
          vuln-type: "os,library"
          severity: "CRITICAL"
          exit-code: "1"
          scanners: "vuln"

      - name: container registry login and auth
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: publish the image on docker.io
        env:
          IMAGE_REPO: docker.io/${{ secrets.DOCKER_USERNAME }}/dummyapi
        run: |
          docker push "${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG}}"
          docker push "${{ env.IMAGE_REPO }}:latest"
